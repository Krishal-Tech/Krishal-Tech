name: Update featured projects

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_featured_projects.py"
      - ".github/workflows/update-featured-projects.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update featured projects
        env:
          GITHUB_OWNER: Krishal-Tech
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: python scripts/update_featured_projects.py

      - name: Commit README update if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh featured GitHub projects"
            git push
          else
            echo "No README changes to commit."
          fi
